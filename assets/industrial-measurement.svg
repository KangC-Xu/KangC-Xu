<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="860" viewBox="0 0 1120 860" role="img" aria-labelledby="title desc">
  <title id="title">Industrial measurement software: a simplified architecture</title>
  <desc id="desc">A Qt operator interface connects to a measurement workflow. The workflow coordinates vision and metrology algorithms, device integration, and inspection data. This diagram describes general responsibilities without proprietary implementation details.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101b2b"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#899bb3" stroke-width="1.6"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .kicker { fill: #7dd3fc; font-size: 16px; font-weight: 600; letter-spacing: 2px; }
      .title { fill: #f0f6fc; font-size: 34px; font-weight: 650; }
      .muted { fill: #a8b8cc; font-size: 18px; }
      .heading { fill: #f0f6fc; font-size: 23px; font-weight: 600; }
      .body { fill: #d3deeb; font-size: 19px; }
      .small { fill: #a8b8cc; font-size: 17px; }
      .wire { fill: none; stroke: #899bb3; stroke-width: 2; marker-end: url(#arrow); }
      .rule { stroke: #304158; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1120" height="860" rx="20" fill="url(#background)"/>
  <rect x="1" y="1" width="1118" height="858" rx="19" fill="none" stroke="#304158"/>

  <text x="42" y="48" class="kicker">ENGINEERING EXPERIENCE</text>
  <text x="42" y="94" class="title">Industrial measurement software</text>
  <text x="42" y="126" class="muted">Vision, calibration and hardware coordination in a C++ / Qt application.</text>

  <rect x="42" y="164" width="1036" height="96" rx="12" fill="#172c40" stroke="#427b9e"/>
  <rect x="42" y="184" width="4" height="56" rx="2" fill="#7dd3fc"/>
  <text x="68" y="203" class="heading">Operator interface</text>
  <text x="68" y="236" class="body">Qt Widgets · Setup &amp; calibration · Live profiles · 3D views · Inspection results</text>

  <path d="M 560 268 V 296" class="wire"/>
  <rect x="42" y="306" width="1036" height="100" rx="12" fill="#1f2440" stroke="#6b6fa7"/>
  <rect x="42" y="326" width="4" height="60" rx="2" fill="#b9b3ff"/>
  <text x="68" y="346" class="heading">Measurement workflow</text>
  <text x="68" y="380" class="body">Scan planning · Acquisition &amp; processing · Algorithm dispatch · Pass / fail decisions</text>

  <path d="M 560 414 V 442 H 208 V 470" class="wire"/>
  <path d="M 560 442 V 470" class="wire"/>
  <path d="M 560 442 H 912 V 470" class="wire"/>

  <rect x="42" y="482" width="332" height="254" rx="12" fill="#142d30" stroke="#39796f"/>
  <text x="66" y="521" class="heading">Vision &amp; metrology</text>
  <line x1="66" y1="539" x2="350" y2="539" class="rule"/>
  <text x="66" y="573" class="body">Fiducial detection &amp; alignment</text>
  <text x="66" y="608" class="body">2D profiles &amp; 3D point clouds</text>
  <text x="66" y="643" class="body">Thickness, width &amp; flatness</text>
  <text x="66" y="678" class="body">Coordinate calibration</text>
  <text x="66" y="714" class="small">OpenCV · ONNX inference</text>

  <rect x="394" y="482" width="332" height="254" rx="12" fill="#22283a" stroke="#626e93"/>
  <text x="418" y="521" class="heading">Device integration</text>
  <line x1="418" y1="539" x2="702" y2="539" class="rule"/>
  <text x="418" y="573" class="body">Industrial cameras</text>
  <text x="418" y="608" class="body">Measurement sensors</text>
  <text x="418" y="643" class="body">Motion control &amp; triggering</text>
  <text x="418" y="678" class="body">Lighting &amp; lens control</text>
  <text x="418" y="714" class="small">Device interfaces · SDKs</text>

  <rect x="746" y="482" width="332" height="254" rx="12" fill="#30291f" stroke="#8b7045"/>
  <text x="770" y="521" class="heading">Inspection data</text>
  <line x1="770" y1="539" x2="1054" y2="539" class="rule"/>
  <text x="770" y="573" class="body">Measurement recipes</text>
  <text x="770" y="608" class="body">Calibration settings</text>
  <text x="770" y="643" class="body">Result files &amp; history</text>
  <text x="770" y="678" class="body">Diagnostic logs</text>
  <text x="770" y="714" class="small">Configuration · Traceability</text>

  <line x1="42" y1="770" x2="1078" y2="770" class="rule"/>
  <text x="42" y="803" class="body">C++17 · Qt 6 · OpenCV · CMake · VTK · Qwt</text>
  <text x="42" y="833" class="small">Logical responsibilities · Simplified public overview · No proprietary implementation details</text>
</svg>
